<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

        <title>Transly</title>
    </head>
    <body>
        <div class="container mt-5"></div>
            <h1 class="text-center mb-4">Transly</h1>  
            <h5 class="text-center mb-4"> Dịch nhanh chóng,chính xác </h5>
            
            <form method="post" class="shadow p-4 rounded bg-light">
                <div class="mb-3">
                    <label for="language" class="form-label">Dịch sang ngôn ngữ:</label>
                    <select class="form-select" name="language" id="language">
                        <option value="en" {% if selected_language == 'en' %}selected{% endif %}>English</option>
                        <option value="vi" {% if selected_language == 'vi' %}selected{% endif %}>Vietnamese</option>
                    </select>
                </div>
                <div class="mb-3">
                    <textarea class="form-control" name="text" rows="5" placeholder="Nhập văn bản cần dịch..."></textarea>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Dịch</button>
                </div>
            </form>

            {% if translated_text %}
                <div class="mt-4 p-4 bg-success text-white rounded">
                    <h2>Văn bản dược dịch :</h2>
                    <p>{{ translated_text }}</p>
                </div>
            {% endif %}
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    </body>
</html>
